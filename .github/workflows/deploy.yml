name: Deploy Order Notification Service to EC2

on:
  push:
    branches:
      - main
      - staging
      - feature/order-notification

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'aws-ec2-production' || github.ref_name == 'staging' && 'aws-ec2-staging' || 'aws-ec2-feature-order-notification' }}
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Test and Build Spring Boot JAR
        run: ./gradlew clean test bootJar

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          cat >> ~/.ssh/config <<EOF
          Host *
            StrictHostKeyChecking accept-new
          EOF
      - name: Upload JAR and Deploy Script to EC2
        run: |
          scp -i ~/.ssh/ec2_key.pem \
            build/libs/bidmart-order-notification-service-0.0.1-SNAPSHOT.jar \
            "$EC2_USER@$EC2_HOST:/tmp/app.jar"
          scp -i ~/.ssh/ec2_key.pem \
            deployment/deploy.sh \
            "$EC2_USER@$EC2_HOST:/tmp/deploy.sh"

      - name: Setup environment config
        run: |
          ssh -i ~/.ssh/ec2_key.pem "$EC2_USER@$EC2_HOST" "sudo mkdir -p /etc/bidmart"
          ssh -i ~/.ssh/ec2_key.pem "$EC2_USER@$EC2_HOST" "sudo tee /etc/bidmart/order-notification.env > /dev/null" << 'ENVEOF'
          SPRING_PROFILES_ACTIVE="prod"
          SPRING_DATASOURCE_URL="jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:6543/postgres?pgbouncer=true"
          SPRING_DATASOURCE_USERNAME="postgres.bgajdqmthfdbixbbdiyl"
          SPRING_DATASOURCE_PASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}"
          SPRING_MAIL_PASSWORD="${{ secrets.SPRING_MAIL_PASSWORD }}"
          SPRING_RABBITMQ_HOST="${{ secrets.SPRING_RABBITMQ_HOST }}"
          SPRING_RABBITMQ_PORT="${{ secrets.SPRING_RABBITMQ_PORT }}"
          SPRING_RABBITMQ_USERNAME="${{ secrets.SPRING_RABBITMQ_USERNAME }}"
          SPRING_RABBITMQ_PASSWORD="${{ secrets.SPRING_RABBITMQ_PASSWORD }}"
          SPRING_RABBITMQ_VHOST="${{ secrets.SPRING_RABBITMQ_VHOST }}"
          AUTH_INTERNAL_SERVICE_URL="${{ secrets.AUTH_INTERNAL_SERVICE_URL }}"
          AUTH_INTERNAL_SERVICE_TOKEN="${{ secrets.AUTH_INTERNAL_SERVICE_TOKEN }}"
          CLARITY_PROJECT_ID="${{ secrets.CLARITY_PROJECT_ID }}"
          SERVER_PORT="8085"
          ENVEOF
          ssh -i ~/.ssh/ec2_key.pem "$EC2_USER@$EC2_HOST" "sudo chmod 600 /etc/bidmart/order-notification.env"

      - name: Execute advanced deploy script
        run: |
          ssh -i ~/.ssh/ec2_key.pem "$EC2_USER@$EC2_HOST" "
            sudo mkdir -p /opt/bidmart-order-notification-service &&
            sudo mv /tmp/deploy.sh /opt/bidmart-order-notification-service/deploy.sh &&
            sudo chmod +x /opt/bidmart-order-notification-service/deploy.sh &&
            sudo /opt/bidmart-order-notification-service/deploy.sh
          "
