<head th:replace="~{fragments/layout :: common-head('Notifications')}">
    <title>Notifications - BidMart</title>
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar('notifications')}"></nav>

<div class="container">
    <div class="header">
        <h1>Notifications</h1>
    </div>

    <div class="filter-group">
        <input type="text" id="userIdInput" placeholder="Enter User ID to view history...">
        <button onclick="loadNotifications()">Search</button>
    </div>

    <div style="background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1rem; margin-bottom: 1.5rem;">
        <h3 style="margin-bottom: 0.5rem;">Live Update Check</h3>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0;">
            Setelah memasukkan User ID, halaman ini subscribe ke <b>/topic/notifications/{userId}</b>.
            Jalankan simulasi di halaman Simulate untuk melihat toast dan list otomatis ter-refresh.
        </p>
        <div style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;">
            <span id="live-status" style="font-size: 0.85rem; color: #64748b;">Belum subscribe</span>
            <button class="btn-outline" style="width: auto;" onclick="goToSimulator()">Buka Simulator</button>
        </div>
    </div>
    
    <div id="list">
        <!-- Records will appear here -->
        <p style="text-align: center; color: #94a3b8;">Enter a User ID to see their notification history.</p>
    </div>
</div>

<script>
    function loadNotifications() {
        const userId = document.getElementById("userIdInput").value;
        if (!userId) return;

        // Save for real-time connection
        localStorage.setItem('bidmart_user_id', userId);
        if (typeof connectWebSocket === 'function') {
            connectWebSocket(userId);
        }
        document.getElementById('live-status').innerText = `Subscribed ke /topic/notifications/${userId}`;

        fetch(`/api/order-notification/notifications/${userId}`)
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById("list");
                list.innerHTML = data.length === 0 ? `<p style="text-align: center; color: #94a3b8;">No notifications found for user "${userId}".</p>` : "";

                data.reverse().forEach(n => {
                    const item = document.createElement("div");
                    item.className = "notif-item";
                    item.innerHTML = `
                        <div class="notif-content">
                            <div class="notif-meta">
                                <span class="type-tag">${n.type || 'UNKNOWN'}</span>
                                <span class="pref-tag">${n.preferenceType}</span>
                                <span>Status: ${n.status}</span>
                            </div>
                            <p>${n.message}</p>
                        </div>
                    `;
                    list.appendChild(item);
                });
            });
    }

    function goToSimulator() {
        window.location.href = '/simulate';
    }

    // Refresh list if a new notification arrives while on this page
    document.addEventListener('new-notification', () => {
        loadNotifications();
    });

    // Auto-load if userId exists
    document.addEventListener('DOMContentLoaded', () => {
        const storedUserId = localStorage.getItem('bidmart_user_id');
        if (storedUserId) {
            document.getElementById("userIdInput").value = storedUserId;
            loadNotifications();
        }
    });
</script>

    <div th:replace="~{fragments/layout :: footer-scripts}"></div>
</body>
</html>
