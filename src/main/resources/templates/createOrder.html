<!DOCTYPE html>
<html lang="id">
<head th:replace="~{fragments/layout :: common-head('Manual Order')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('simulate')}"></nav>

<div class="container">
    <div class="card">
        <h1>Manual Order Creation</h1>
        
        <div class="form-group">
            <label>User ID</label>
            <input type="text" id="userId" placeholder="Enter User ID">
        </div>

        <div class="form-group">
            <label>Total Price</label>
            <input type="number" id="totalPrice" placeholder="0.00">
        </div>

        <button onclick="createOrder()">Create Order</button>
        
        <p>Looking for Auction Simulation? <a href="/simulate" class="link">Go to Simulator</a></p>
    </div>
</div>

<script>
    function createOrder() {
        const userId = document.getElementById("userId").value;
        const totalPrice = document.getElementById("totalPrice").value;

        if (!userId || !totalPrice) return alert("Please fill all fields");

        fetch(`/api/order-notification/orders`, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: `userId=${userId}&totalPrice=${totalPrice}`
        })
        .then(res => {
            if (res.ok) {
                window.location.href = "/orders";
            } else {
                alert("Failed to create order");
            }
        });
    }
</script>

</body>
</html>
