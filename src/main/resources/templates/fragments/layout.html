<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="common-head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - BidMart'"></title>
    <!-- Modern Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Ionicons for beautiful icons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>

<nav th:fragment="navbar(activePage)">
    <div style="display: flex; align-items: center; gap: 0.5rem; position: absolute; left: 2rem; top: 1.25rem;">
        <ion-icon name="hammer" style="font-size: 1.5rem; color: var(--primary);"></ion-icon>
        <span style="font-weight: 800; font-size: 1.25rem; letter-spacing: -0.05em; color: var(--text);">BidMart</span>
    </div>
    <a href="/orders" th:class="${activePage == 'orders' ? 'active' : ''}">Orders</a>
    <a href="/notifications" th:class="${activePage == 'notifications' ? 'active' : ''}">Notifications</a>
    <a href="/preferences" th:class="${activePage == 'preferences' ? 'active' : ''}">Preferences</a>
    <a href="/simulate" th:class="${activePage == 'simulate' ? 'active' : ''}">Simulate</a>
</nav>

<div th:fragment="footer-scripts">
    <div id="toast-container" style="position: fixed; bottom: 30px; right: 30px; z-index: 9999; display: flex; flex-direction: column; gap: 12px;"></div>

    <script>
        let stompClient = null;

        function connectWebSocket(userId) {
            if (!userId) return;
            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            stompClient.debug = null; 
            stompClient.connect({}, function (frame) {
                stompClient.subscribe('/topic/notifications/' + userId, function (notification) {
                    showToast(notification.body, 'info');
                    document.dispatchEvent(new CustomEvent('new-notification', { detail: notification.body }));
                });
            });
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-alert';
            
            const icon = type === 'success' ? 'checkmark-circle' : 'notifications';
            const accentColor = type === 'success' ? '#10b981' : '#6366f1';

            toast.style.cssText = `
                background: rgba(15, 23, 42, 0.9);
                backdrop-filter: blur(10px);
                color: white;
                padding: 16px 24px;
                border-radius: 16px;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
                border-left: 6px solid ${accentColor};
                display: flex;
                align-items: center;
                gap: 12px;
                min-width: 300px;
                animation: toastSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
                font-weight: 500;
            `;

            toast.innerHTML = `
                <ion-icon name="${icon}" style="font-size: 1.5rem; color: ${accentColor};"></ion-icon>
                <span>${message}</span>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'toastSlideOut 0.4s ease forwards';
                setTimeout(() => toast.remove(), 400);
            }, 5000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const storedUserId = localStorage.getItem('bidmart_user_id');
            if (storedUserId) {
                connectWebSocket(storedUserId);
            }
        });
    </script>

    <style>
        @keyframes toastSlideIn {
            from { transform: translateX(100%) scale(0.9); opacity: 0; }
            to { transform: translateX(0) scale(1); opacity: 1; }
        }
        @keyframes toastSlideOut {
            from { transform: translateX(0) scale(1); opacity: 1; }
            to { transform: translateX(50%) scale(0.9); opacity: 0; }
        }
    </style>
</div>

</body>
</html>
