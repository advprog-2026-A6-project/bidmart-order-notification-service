<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auction Simulation - BidMart</title>
    <style>
        :root {
            --primary: #0ea5e9;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        nav { background: #fff; padding: 1rem 2rem; display: flex; gap: 2rem; border-bottom: 1px solid #e2e8f0; }
        nav a { text-decoration: none; color: #64748b; font-weight: 500; transition: color 0.2s; }
        nav a:hover { color: var(--primary); }
        nav a.active { color: var(--primary); }
        .container { max-width: 600px; margin: 3rem auto; padding: 0 1rem; }
        .card { background: var(--card); padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        h1 { margin-top: 0; font-size: 1.5rem; color: #0369a1; }
        p { color: #64748b; font-size: 0.9rem; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem; }
        input { width: 100%; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; }
        button { cursor: pointer; background: var(--primary); color: white; border: none; padding: 0.875rem; border-radius: 8px; font-weight: 600; width: 100%; margin-top: 1rem; transition: background 0.2s; }
        button:hover { background: #0284c7; }
        pre { background: #f1f5f9; padding: 1rem; border-radius: 8px; font-size: 0.8rem; overflow-x: auto; margin-top: 2rem; display: none; }
    </style>
</head>
<body>

<nav>
    <a href="/orders">Orders</a>
    <a href="/notifications">Notifications</a>
    <a href="/preferences">Preferences</a>
    <a href="/simulate" class="active">Simulate</a>
</nav>

<div class="container">
    <div class="card">
        <h1>Auction Finish Simulation</h1>
        <p>Trigger an automatic order and notification as if an auction just ended.</p>
        
        <div class="form-group">
            <label>Auction ID</label>
            <input type="number" id="auctionId" value="101">
        </div>

        <div class="form-group">
            <label>Winner ID (User ID)</label>
            <input type="text" id="winnerId" placeholder="e.g. user123">
        </div>

        <div class="form-group">
            <label>Item Name</label>
            <input type="text" id="itemName" value="MacBook Pro M3">
        </div>

        <div class="form-group">
            <label>Final Price</label>
            <input type="number" id="finalPrice" value="2500.0">
        </div>

        <button onclick="simulate()">Trigger Auction Finish</button>
        
        <div id="debug-info" style="margin-top: 1rem; font-size: 0.8rem; color: #ef4444; display: none;">
            ⚠️ <strong>Peringatan:</strong> User ID ini belum mengatur email di halaman Preferences. Email tidak akan terkirim.
        </div>

        <pre id="output"></pre>
    </div>
</div>

<script>
    function checkUser() {
        const userId = document.getElementById("winnerId").value;
        const debug = document.getElementById("debug-info");
        if (!userId) {
            debug.style.display = "none";
            return;
        }

        fetch(`/api/order-notification/preferences/${userId}`)
            .then(res => res.json())
            .then(data => {
                if (!data.email || !data.emailEnabled) {
                    debug.style.display = "block";
                    debug.style.color = "#f59e0b";
                    debug.innerHTML = "⚠️ <strong>Info:</strong> User ditemukan, tapi Email dimatikan atau belum diisi.";
                } else {
                    debug.style.display = "block";
                    debug.style.color = "#10b981";
                    debug.innerHTML = "✅ <strong>Siap:</strong> Email akan dikirim ke: " + data.email;
                }
            })
            .catch(() => {
                debug.style.display = "block";
                debug.style.color = "#ef4444";
                debug.innerHTML = "❌ <strong>Error:</strong> User ID ini belum terdaftar di Preferences. Email akan gagal.";
            });
    }

    // Bind event
    document.getElementById("winnerId").addEventListener("input", checkUser);

    function simulate() {
        const payload = {
            auctionId: document.getElementById("auctionId").value,
            winnerId: document.getElementById("winnerId").value,
            itemName: document.getElementById("itemName").value,
            finalPrice: document.getElementById("finalPrice").value
        };

        const out = document.getElementById("output");
        out.style.display = "block";
        out.innerText = "Processing...";

        fetch('/api/order-notification/auction-finish', {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            out.innerText = "Success! Automatic Order Created:\n" + JSON.stringify(data, null, 2);
        })
        .catch(err => {
            out.innerText = "Error: " + err.message;
        });
    }
</script>

</body>
</html>
