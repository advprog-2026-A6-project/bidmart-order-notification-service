<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders - BidMart</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        nav { background: #fff; padding: 1rem 2rem; display: flex; gap: 2rem; border-bottom: 1px solid #e2e8f0; }
        nav a { text-decoration: none; color: #64748b; font-weight: 500; transition: color 0.2s; }
        nav a:hover, nav a.active { color: var(--primary); }
        .container { max-width: 800px; margin: 3rem auto; padding: 0 1rem; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        h1 { margin: 0; font-size: 1.875rem; color: #1e1b4b; }
        .btn-refresh { cursor: pointer; background: #fff; border: 1px solid #e2e8f0; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 500; }
        .grid { display: grid; gap: 1rem; }
        .order-card { background: #fff; padding: 1.25rem; border-radius: 10px; border: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .order-info h3 { margin: 0; font-size: 1rem; }
        .order-info p { margin: 0.25rem 0 0; font-size: 0.875rem; color: #64748b; }
        .status-badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .status-created { background: #dcfce7; color: #166534; }
        .status-auto { background: #e0e7ff; color: #3730a3; }
    </style>
</head>
<body>

<nav>
    <a href="/orders" class="active">Orders</a>
    <a href="/notifications">Notifications</a>
    <a href="/preferences">Preferences</a>
    <a href="/simulate">Simulate</a>
</nav>

<div class="container">
    <div class="header">
        <h1>Orders</h1>
        <button class="btn-refresh" onclick="loadOrders()">Refresh List</button>
    </div>
    
    <div id="orders" class="grid">
        <!-- Records will appear here -->
    </div>
</div>

<script>
    function loadOrders() {
        fetch('/api/order-notification/orders') // Using the API endpoint from OrderNotificationController
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById("orders");
                list.innerHTML = data.length === 0 ? "<p>No orders found.</p>" : "";

                data.reverse().forEach(o => {
                    const card = document.createElement("div");
                    card.className = "order-card";
                    
                    const isAuto = o.status === "AUTOMATIC_CREATED";
                    
                    card.innerHTML = `
                        <div class="order-info">
                            <h3>${o.itemName || 'Unnamed Item'}</h3>
                            <p>User ID: ${o.userId} | Auction ID: ${o.auctionId || 'N/A'}</p>
                            <p><strong>$${o.totalPrice.toLocaleString()}</strong></p>
                        </div>
                        <span class="status-badge ${isAuto ? 'status-auto' : 'status-created'}">
                            ${o.status}
                        </span>
                    `;
                    list.appendChild(card);
                });
            });
    }

    // Auto load
    loadOrders();
</script>

</body>
</html>
