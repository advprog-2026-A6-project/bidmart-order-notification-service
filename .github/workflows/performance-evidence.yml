name: Performance Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-performance-evidence:
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8085
      CLARITY_PROJECT_ID: ci-evidence

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build with profiling tests
        run: ./gradlew --no-daemon clean test bootJar

      - name: Start application
        run: |
          mkdir -p performance-evidence/profiling
          java -jar build/libs/bidmart-order-notification-service-0.0.1-SNAPSHOT.jar \
            --spring.rabbitmq.listener.simple.auto-startup=false \
            > performance-evidence/profiling/app.log 2>&1 &
          echo $! > performance-evidence/profiling/app.pid

          for i in {1..60}; do
            if curl -fsS http://localhost:8085/actuator/health > performance-evidence/profiling/health.json; then
              exit 0
            fi
            sleep 2
          done

          cat performance-evidence/profiling/app.log
          exit 1

      - name: Run Locust load test
        run: |
          python -m pip install --upgrade pip locust
          mkdir -p performance-evidence/apdex
          locust -f load-testing/locustfile.py \
            --host=http://localhost:8085 \
            --headless -u 100 -r 10 -t 2m \
            --html performance-evidence/apdex/locust-after.html \
            --csv performance-evidence/apdex/locust-after

      - name: Run Lighthouse audit
        run: |
          npm install -g lighthouse
          mkdir -p performance-evidence/lighthouse
          lighthouse http://localhost:8085/orders \
            --chrome-flags="--headless --no-sandbox" \
            --output=html \
            --output-path=performance-evidence/lighthouse/lighthouse-after.html

      - name: Capture actuator metrics snapshot
        if: always()
        run: |
          mkdir -p performance-evidence/monitoring
          curl -fsS http://localhost:8085/actuator/prometheus \
            > performance-evidence/monitoring/prometheus-metrics-after.txt || true

      - name: Upload performance evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: order-notification-performance-evidence
          path: |
            performance-evidence
            build/reports/tests/test
            build/reports/jacoco/test/html
          if-no-files-found: warn
